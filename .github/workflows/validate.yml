name: Validate build

on:
  push:
    branches: [claude/neurica-eonyx-relaunch-5e3glx]
  pull_request:
    branches: [claude/neurica-eonyx-relaunch-5e3glx]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
